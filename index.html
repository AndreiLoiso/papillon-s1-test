  --tip:#FBF1D4; --tip-ink:#5A4509; --short:#E1ECF7; --short-ink:#1E4468;
  --danger:#A23B2F;
  --shadow:0 1px 2px rgba(20,50,80,.06);
  --serif:'Aboreto','Cinzel',Georgia,'Times New Roman',serif;
  --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0B1824; --surface:#13273A; --ink:#E7EEF5; --muted:#9BB0C3; --line:#26425C;
  --accent:#79B2E0; --accent-ink:#082338; --accent-soft:#1B3A57;
  --band:#1D5380; --gold:#EDB127; --gold-ink:#FFFFFF; --gold-soft:#3A2F10;
  --leaf:#EDB127; --leaf-soft:#3A2F10;
  --tip:#2D2A14; --tip-ink:#E8D79A; --short:#16304A; --short-ink:#BBD8F2;
  --danger:#E0857A; --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1824; --surface:#13273A; --ink:#E7EEF5; --muted:#9BB0C3; --line:#26425C;
    --accent:#79B2E0; --accent-ink:#082338; --accent-soft:#1B3A57;
    --band:#1D5380; --gold:#EDB127; --gold-ink:#FFFFFF; --gold-soft:#3A2F10;
    --leaf:#EDB127; --leaf-soft:#3A2F10;
    --tip:#2D2A14; --tip-ink:#E8D79A; --short:#16304A; --short-ink:#BBD8F2;
    --danger:#E0857A; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em;letter-spacing:-.005em}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:600 1.1rem var(--serif);text-decoration:none;color:var(--ink)}
.brand small{font:500 .8rem var(--sans);color:var(--muted);margin-left:2px}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.testbadge{font-size:.72rem;background:var(--leaf-soft);color:var(--ink);border:1px solid var(--leaf);padding:2px 8px;border-radius:999px}

main{max-width:640px;margin:0 auto;padding:18px 16px 110px}
.view>*+*{margin-top:14px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:500}
.nav a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.nav a[aria-current="page"] svg{stroke-width:2.3}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-bottom:.3em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);border:1px solid transparent}
.chip.ghost{background:none;border-color:var(--line);color:var(--muted)}

/* hero + caterpillar */
.hero{padding:18px 16px 12px;border-radius:20px;background:linear-gradient(180deg,var(--leaf-soft),var(--surface) 85%);border:1px solid var(--line)}
.hero h1{margin-bottom:.1em}
.hero .sub{color:var(--muted);margin-bottom:6px}
.cat{width:100%;height:auto;display:block;margin:4px 0 0}
.cat .head{fill:var(--leaf)}
.cat .eye{fill:var(--ink)}
.cat .smile,.cat .ant{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.cat .seg{cursor:pointer}
.cat .ring{fill:var(--surface);stroke:var(--line);stroke-width:2.5}
.cat .fill{fill:var(--leaf)}
.cat .sel .ring{stroke:var(--accent);stroke-width:4}
.cat .dn{fill:var(--muted);font:600 11px var(--sans);text-anchor:middle}
.cat .sel .dn{fill:var(--accent)}
.cat .td{fill:var(--accent)}
.daylabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.daylabel b{font:600 1.05rem var(--serif)}

/* moment sections */
.moment-h{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.moment-h small{color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row b{font-weight:600;display:block;line-height:1.3}
.row small{color:var(--muted)}
.check{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;border:2px solid var(--muted);border-radius:8px;background:var(--surface);display:grid;place-items:center;cursor:pointer;margin:0}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.go{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--muted);text-decoration:none;flex:none}
.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.done b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.mini{display:flex;gap:6px;align-items:center;color:var(--muted)}
.mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mini .on{color:var(--accent)}

.summary{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:600 1.5rem var(--serif)}
.stat span{font-size:.82rem;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.btn.danger{border-color:var(--danger);color:var(--danger);background:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* media slots */
.slot{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.slot-h{display:flex;align-items:center;gap:10px}
.slot-h svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slot-h b{display:block;line-height:1.2}
.slot-h small{color:var(--muted)}
.slot.empty{border-style:dashed;background:transparent}
.slot.empty .slot-h svg{stroke:var(--muted)}
.slot audio{width:100%}
.slot video,.slot iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.adm{display:flex;gap:6px}
.adm input{flex:1;min-width:0}

/* steps and boxes */
.steps{list-style:none;counter-reset:s;padding:0;margin:8px 0 0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:.9rem;display:grid;place-items:center}
.box{border-radius:14px;padding:12px 14px}
.box b{display:block;margin-bottom:2px}
.box.tip{background:var(--tip);color:var(--tip-ink)}
.box.short{background:var(--short);color:var(--short-ink)}
.box.ex{border:1px solid var(--line);font-style:italic}
.bullets{margin:6px 0 0;padding-left:20px}
.bullets li{margin:4px 0}

/* timer */
.timer{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.timer .tt{font:600 1.7rem var(--serif);min-width:4.2ch;font-variant-numeric:tabular-nums}

/* forms */
label.f{display:block;font-weight:600;font-size:.95rem;margin:12px 0 4px}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
textarea{min-height:76px;resize:vertical;line-height:1.45}
.q{margin-top:12px}
.q label{font-weight:600;display:block;margin-bottom:4px}
.q .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);font-size:.82rem;margin-right:8px}
.grat{display:grid;gap:8px}
.saved{font-size:.8rem;color:var(--muted)}

/* segmented tabs */
.seg-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg-tabs button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;cursor:pointer;color:var(--muted);font-weight:600}
.seg-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* radar */
.radar{width:100%;height:auto;display:block}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .poly{fill:color-mix(in srgb,var(--accent) 28%,transparent);stroke:var(--accent);stroke-width:2.2}
.radar .dot{fill:var(--accent)}
.radar text{fill:var(--ink);font:500 10.5px var(--sans)}
.dom{padding:10px 0;border-top:1px solid var(--line)}
.dom:first-child{border-top:0}
.dom-top{display:flex;gap:8px;align-items:center}
.dom-top input[type=text]{flex:1;min-height:38px;padding:6px 10px}
.dom-v{font:600 1.2rem var(--serif);width:2ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 2px}
.dom .note{margin-top:6px}

/* theory */
.tcard{display:block;text-decoration:none;color:inherit}
.tcard h3{margin-bottom:2px}
.lead{font:500 1.05rem/1.4 var(--serif);color:var(--muted);margin-bottom:10px}
.band{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.band div{background:var(--leaf-soft);border-radius:12px;padding:10px;text-align:center}
.band b{display:block;font-family:var(--serif)}
.band span{font-size:.82rem;color:var(--muted)}
.weeks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.weeks li{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:10px;font-size:.92rem;color:var(--muted)}
.weeks li b{width:3.4ch;color:inherit}
.weeks li.now{background:var(--accent-soft);color:var(--ink);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:8px}

/* feedback */
.rate{display:flex;gap:6px}
.rate button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fbq{display:flex;gap:8px;margin:8px 0}
.fbq button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-weight:600}
.fbq button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.hist details{border-top:1px solid var(--line);padding:8px 0}
.hist summary{cursor:pointer;font-weight:600}
.hist p{margin:6px 0 0}

/* dialog + toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,20,20,.55);display:grid;place-items:center;padding:16px}
.overlay[hidden]{display:none}
.overlay .dlg{background:var(--surface);color:var(--ink);border-radius:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg{padding:22px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* notițe de revizuire (pentru Adela) */
.review{margin-top:28px;padding:16px;border-radius:16px;border:2px dashed #C9871A;background:var(--tip);color:var(--tip-ink)}
.review h2{font-size:1.1rem;margin-bottom:.3em}
.review textarea{background:var(--surface);color:var(--ink)}
.review .btn{border-color:#9C6A12;background:#9C6A12;color:#fff}
.review .btn.ghost{background:none;color:inherit;border-color:#9C6A12}

.tchecks{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.okbadge{display:inline-block;font:600 .72rem var(--sans,inherit);padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);vertical-align:middle;margin-left:6px}
.okbadge.half{background:var(--tip);color:var(--tip-ink)}

/* ===================== Identitate Papillon ===================== */
h1{font-size:1.2rem;text-transform:uppercase;letter-spacing:.14em;background:var(--band);color:var(--gold);padding:14px 16px;border-radius:2px;margin:0;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
h2{font-size:.98rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
h3{font-size:1rem;letter-spacing:.03em;color:var(--accent)}
.lead{font:500 1rem/1.5 var(--sans)}

/* antet */
.top{background:var(--band);border-bottom:3px solid var(--gold);backdrop-filter:none}
.top-in{height:60px;padding:0 16px}
.brand{color:var(--gold);gap:10px;letter-spacing:.2em;font-size:1.05rem;font-weight:700;text-transform:uppercase}
.brand .logo{width:42px;height:42px;display:block}
.brand small{color:#fff;font:600 .66rem var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-left:2px}
.iconbtn{border-color:rgba(255,255,255,.5);color:#fff;background:rgba(255,255,255,.08);border-radius:2px}
.testbadge{background:transparent;color:#fff;border:1px solid var(--gold);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px}
@media (max-width:430px){.brand small{display:none}}

/* navigare jos */
.nav{border-top:3px solid var(--gold)}
.nav-in{grid-template-columns:repeat(6,1fr)}
.nav a{font-size:.68rem;padding:7px 1px 8px;letter-spacing:.02em}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav a.hl{color:var(--accent);font-weight:700}
.nav a.hl svg{background:var(--gold);color:#fff;border-radius:50%;padding:4px;width:31px;height:31px;stroke-width:2.1}
.nav a.hl[aria-current="page"] svg{box-shadow:0 0 0 2px var(--accent)}

/* buton Înapoi fix */
.backbar{position:sticky;top:63px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:2px;padding:6px 8px;margin-top:-4px;box-shadow:0 3px 10px rgba(20,50,80,.12)}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 8px;border:0;background:var(--gold);color:#fff;border-radius:2px;font:700 .9rem var(--serif);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.backbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.backwhere{font:600 .7rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* carduri și forme (colțuri drepte, ca pe site) */
.card{border-radius:4px;box-shadow:var(--shadow)}
.stat{border-radius:4px}.stat b{color:var(--accent)}
.hero{padding:0;background:var(--surface);border-radius:4px;overflow:hidden}
.hero h1{border-radius:0;font-size:1.25rem}
.hero-body{padding:12px 16px 14px}
.moment-h{margin:-16px -16px 10px;padding:10px 16px;background:var(--band);border-radius:4px 4px 0 0;display:flex;align-items:baseline;gap:10px}
.moment-h h2{color:#fff;margin:0}
.moment-h small{color:#fff;opacity:.88}
.rt{display:block;color:inherit;text-decoration:none}
.go{border-radius:2px;color:var(--accent)}
.check{border-radius:4px;border-color:var(--accent)}
.check:checked{background:var(--gold);border-color:var(--gold)}
.check:checked::after{border-color:#fff}
.chip{background:var(--accent-soft)}
.slot,.timer,.box{border-radius:4px}
.steps li::before{background:var(--gold);color:#fff}
textarea,input[type=text],input[type=date],input[type=number],select{border-radius:4px}
.band div{border-radius:4px}

/* butoane: auriu #EDB127, text alb cu majuscule spațiate, colțuri drepte */
.btn{background:var(--gold);border-color:var(--gold);color:#fff;border-radius:2px;font-family:var(--serif);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.9rem}
.btn.small{font-size:.78rem;letter-spacing:.08em}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.6;cursor:wait}
.seg-tabs{border-radius:4px}
.seg-tabs button{border-radius:2px}
.seg-tabs button[aria-selected="true"]{background:var(--gold);color:#fff}
.seg-tabs.three{display:grid;grid-template-columns:1fr 1.25fr .9fr}
.seg-tabs.three button{font-size:.8rem;line-height:1.25;padding:6px 4px;min-height:50px}
.rate button,.fbq button{border-radius:2px}
.rate button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.fbq button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.legend{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted);margin-top:4px}

/* Teorie: evidențiere */

/* jurnal */
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--band);border-radius:2px;padding-right:10px}
.titlerow h1{background:none;flex:1;min-width:0}
.histlink{display:inline-flex;align-items:center;gap:6px;color:#fff;background:var(--gold);text-decoration:none;border-radius:2px;padding:0 12px;font:700 .78rem var(--serif);letter-spacing:.08em;text-transform:uppercase;min-height:42px}
.histlink svg,.histic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.histic{color:var(--gold);display:grid;place-items:center;padding:0 6px}
.histic svg{width:26px;height:26px}
.idea{border-top:1px solid var(--line);padding:10px 0}
.idea:first-of-type{border-top:0}
.idea p{margin:4px 0 0}
.idea-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{background:none;border:0;color:var(--danger);cursor:pointer;font-size:.82rem;text-decoration:underline;min-height:32px;padding:0 4px}

/* ecran de bun venit */
.overlay .dlg{border-radius:4px}
.wlogo{display:block;margin:0 auto 6px;width:84px;height:84px}
.wt{text-align:center}

/* omizi */
.cat .seg{text-decoration:none}
.cat .ck{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.cat.theory .head,.cat.theory .fill,.cat.theory .td{fill:var(--accent)}
.cat.theory .seg:hover .ring,.cat.theory .seg:focus-visible .ring{stroke:var(--accent)}
.catblock+.catblock{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card.catblock{padding:14px 16px}
.catlabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.catlabel b{font:700 .8rem var(--serif);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.catlabel span,.catlabel a{font-size:.85rem;color:var(--muted)}
.catlabel a{color:var(--accent);font-weight:600}

/* uniformitate */
.review h2{color:inherit}
.view>h2{border-left:4px solid var(--gold);padding-left:10px}
.tcard{display:flex;align-items:center;gap:10px}
.tcard .grow{flex:1;min-width:0}
.chip.ok{background:var(--gold);color:#fff;font-weight:600}
.pager .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- varianta artefact: notițe comune ---- */
.art [data-dl], .art [data-review-dl] { display: none; }
.notes { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; }
.note.mine { border-left: 3px solid var(--gold); }
.note .nh { display: flex; align-items: center; gap: 10px; font-size: .82rem; }
.note .nh span { color: var(--muted); margin-right: auto; }
.note .nx { background: none; border: 0; padding: 4px; color: inherit; cursor: pointer; opacity: .7; }
.note .nx svg { width: 16px; height: 16px; display: block; }
.note p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* tura 3: Aboreto la titluri, butoane rotunjite cu litere mici */
h1,h2,h3,.brand,.backbtn,.histlink,.catlabel b,.band b,.stat b,.daylabel b,.timer .tt{font-weight:400}
.btn,.btn.small{border-radius:16px;font-family:var(--sans);font-weight:700;text-transform:none;letter-spacing:.07em;font-size:.95rem}
.btn.small{font-size:.85rem}
.backbtn,.histlink{border-radius:16px;text-transform:none;letter-spacing:.06em}
.slot video{max-height:72vh;object-fit:contain}
.numl{margin:4px 0 8px;padding-left:1.4rem}.numl li{margin:2px 0}
.acc{border-top:1px solid var(--line);padding:6px 0}.acc summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
.lec{margin:4px 0 8px;padding-left:1.1rem}.lec li{margin:6px 0;font-size:.93rem}
/* toate butoanele: litere mici */
button,.btn,.btn.small,.backbtn,.histlink,.go,[role=button],input[type=button],input[type=submit]{text-transform:none!important}
/* Aboreto desenează doar majuscule: butoanele folosesc același font ca „Salvează" */
.backbtn,.histlink{font-family:var(--sans)!important;font-weight:700!important;font-size:.95rem;letter-spacing:.07em;text-transform:none!important}
button,.btn,.btn.small,.backbtn,.histlink{text-transform:lowercase!important}

</style>

const NOEMBED = false; /* true doar în artefactul de test: acolo iframe-urile externe sunt blocate */
function embedOf(url, kind) {
  if (/^\/_blob\/[0-9a-f]+$/i.test(url)) return { type: kind === 'audio' ? 'audio' : 'video', src: url };
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (m) return { type: 'iframe', src: `https://www.youtube-nocookie.com/embed/${m[1]}`, link: url };
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { type: 'iframe', src: `https://player.vimeo.com/video/${m[1]}`, link: url };
  if (kind === 'audio' && /\.(mp4|m4a)(\?|#|$)/i.test(url)) return { type: 'audio', src: url };
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url)) return { type: 'video', src: url };
  if (/\.(mp3|m4a|wav|ogg|aac)(\?|#|$)/i.test(url)) return { type: 'audio', src: url };
  return { type: 'link', src: url };
}

function mediaSlot(id, kind, label) {
  const isAudio = kind === 'audio', isDoc = kind === 'doc';
  const title = isDoc ? 'Documentul „A vedea, a se cunoaște, a se accepta”' : (label || (isAudio ? 'Ascultă instrucțiunile' : 'Vezi explicațiile'));
  const soon = isDoc ? 'Îl primești și prin e-mail de la Adela' : (isAudio ? 'Înregistrarea cu instrucțiunile Adelei' : 'Videoul cu explicații');
  const ic = isDoc ? 'doc' : (isAudio ? 'audio' : 'video');
  const url = getMedia(id, kind);
  const adm = isAdm() ? `<div class="adm"><input type="text" placeholder="Lipește linkul ${isDoc ? 'documentului' : (isAudio ? 'audio' : 'video')}" value="${esc(SYNC.media[`${id}:${kind}`] ?? S.media[`${id}:${kind}`] ?? '')}" data-media-in="${id}:${kind}"><button class="btn small" data-media-save="${id}:${kind}">Salvează</button></div>` : '';
  if (!url) {
    return `<div class="slot empty"><div class="slot-h">${svg(ic)}<div><b>${esc(title)}</b><small>${soon}. Disponibil în curând.</small></div></div>${adm}</div>`;
  }
  const e = embedOf(url, kind);
  let player = '';
  if (isDoc) player = `<a class="btn ghost small" href="${esc(url)}" target="_blank" rel="noopener">Deschide documentul</a>`;
  else if (e.type === 'iframe' && NOEMBED) player = `<a class="btn small" href="${esc(e.link)}" target="_blank" rel="noopener">Vezi videoul pe YouTube</a><small class="muted">În versiunea de test videoul se deschide într-o filă nouă. În aplicația finală se va vedea direct aici.</small>`;
  else if (e.type === 'iframe' && location.protocol === 'file:') player = `<a class="btn small" href="${esc(e.link)}" target="_blank" rel="noopener">Vezi videoul pe YouTube</a><small class="muted">Deschis direct din fișier, YouTube nu poate fi afișat aici. Pe site (https) se vede direct în pagină.</small>`;
  else if (e.type === 'iframe') player = `<iframe src="${esc(e.src)}" referrerpolicy="strict-origin-when-cross-origin" title="${esc(title)}" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe><a class="small" href="${esc(e.link)}" target="_blank" rel="noopener">Deschide într-o fereastră nouă</a>`;
  else if (e.type === 'video') player = `<video controls playsinline preload="metadata" src="${esc(e.src)}"></video>`;
  else if (e.type === 'audio') player = `<audio controls preload="none" src="${esc(e.src)}"></audio>`;
  else player = `<a class="btn ghost small" href="${esc(e.src)}" target="_blank" rel="noopener">Deschide ${isAudio ? 'înregistrarea' : 'videoul'}</a>`;
  return `<div class="slot"><div class="slot-h">${svg(ic)}<div><b>${esc(title)}</b></div></div>${player}${adm}</div>`;
}

/* ---- cronometru ---- */
let timerState = null;
function stopTimer() { if (timerState) { clearInterval(timerState.iv); timerState = null; } }
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.28].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = i ? 660 : 523; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.4);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.45);
    });
  } catch (e) { /* fără sunet */ }
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* ignor */ }
}
const mmss = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
function toggleTimer(btn) {
  const wrap = btn.closest('.timer'), out = $('.tt', wrap), sec = +wrap.dataset.sec;
  if (timerState) { stopTimer(); out.textContent = mmss(sec); btn.textContent = 'Pornește'; return; }
  const end = Date.now() + sec * 1000;
  btn.textContent = 'Oprește';
  timerState = {
    iv: setInterval(() => {
      const left = Math.max(0, Math.round((end - Date.now()) / 1000));
      out.textContent = mmss(left);
      if (left <= 0) { stopTimer(); btn.textContent = 'Pornește'; out.textContent = 'Gata'; beep(); }
    }, 250),
  };
}

/* ---- instrument: Roata Vieții ---- */
function radarSVG(domains) {
  const n = domains.length, cx = 180, cy = 168, R = 100;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 10, cy + Math.sin(a) * R * v / 10, a]; };
  let o = '<svg class="radar" viewBox="-40 0 440 340" role="img" aria-label="Roata Vieții">';
  [2, 4, 6, 8, 10].forEach(r => { o += `<polygon class="ring" points="${domains.map((_, i) => pt(i, r).slice(0, 2).map(x => x.toFixed(1)).join(',')).join(' ')}"/>`; });
  domains.forEach((d, i) => {
    const [x, y] = pt(i, 10); o += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx, ly, a] = pt(i, 10 + 1.6 * 10 / 10 * 1.0);
    const tx = cx + Math.cos(a) * (R + 14), ty = cy + Math.sin(a) * (R + 14) + 4;
    const anchor = Math.cos(a) > 0.25 ? 'start' : Math.cos(a) < -0.25 ? 'end' : 'middle';
    const name = d.n.length > 16 ? d.n.slice(0, 15) + '…' : d.n;
    o += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}">${esc(name)}</text>`;
  });
  o += `<polygon class="poly" points="${domains.map((d, i) => pt(i, d.v).slice(0, 2).map(x => x.toFixed(1)).join(',')).join(' ')}"/>`;
  domains.forEach((d, i) => { const [x, y] = pt(i, d.v); o += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4"/>`; });
  return o + '</svg>';
}

/* ---------- FEEDBACK ---------- */
const RATINGS = [
  ['clar', 'Cât de clare sunt exercițiile?', 'neclar', 'foarte clar'],
  ['teorie', 'Cât de utilă ți se pare teoria?', 'deloc utilă', 'foarte utilă'],
  ['app', 'Cât de ușor e de folosit aplicația?', 'greu de folosit', 'foarte ușor'],
];
const yn = v => v === 'da' ? 'Da' : v === 'nu' ? 'Nu' : 'fără răspuns';
function ynButtons(path, cur) {
  return `<div class="fbq" role="group">${[['da', 'Da'], ['nu', 'Nu']].map(([v, l]) => `<button type="button" data-yn="${path}" data-val="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;
}
const plural = (n, one, many) => n === 1 ? `${n} ${one}` : `${n} ${many}`;
function usageStats() {
  const days = weekDays(), started = days.filter(d => dayDone(d) > 0).length;
  const avg = Math.round(100 * days.reduce((a, d) => a + dayPct(d), 0) / 7);
  const journalDays = days.filter(d => S.journal[d] && Object.values(S.journal[d]).some(Boolean)).length;
  return { started, avg, journalDays, opened: Object.keys(S.stats.opens).length };
}
function feedbackText() {
  const g = S.fb.gen, u = usageStats();
  let t = `Feedback Papillon, săptămâna 1 (${CONFIG.version})\nData: ${todayISO()}\n`;
  if (S.profile.name) t += `Nume: ${S.profile.name}\n`;
  t += `\nFolosire: exerciții bifate în ${u.started} din 7 zile, ${u.avg}% din exerciții bifate în medie, jurnal completat în ${u.journalDays} zile, ${u.opened} din ${EX.length} exerciții deschise, teorie: ${thCount()} din ${THEORY.length} concepte parcurse, ${(S.ideas || []).length} idei adăugate în jurnal.\n\nEvaluări (1–5):\n`;
  RATINGS.forEach(([k, l, lo, hi]) => { t += `- ${l} (1 = ${lo}, 5 = ${hi}): ${g[k] || 'fără răspuns'}\n`; });
  t += `\nEstimarea de timp din exerciții a fost realistă: ${yn(g.timp)}\n`;
  if (g.timp === 'nu') t += `Ar prefera să își poată seta durata fiecărui exercițiu: ${yn(g.setare)}\n`;
  [['util', 'Exerciții și concepte teoretice cele mai utile, și de ce'], ['neclar', 'Exerciții sau concepte neclare']].forEach(([k, l]) => { if (g[k]) t += `\n${l}:\n${g[k]}\n`; });
  const ex = Object.entries(S.fb.ex).filter(([, v]) => v.r || v.c);
  if (ex.length) { t += '\nPe exerciții:\n'; ex.forEach(([id, v]) => { t += `- ${exById(id).title}: ${v.r === 1 ? 'clar' : v.r === -1 ? 'nu prea clar' : ''}${v.c ? ' (' + v.c + ')' : ''}\n`; }); }
  return t;
}
function viewFeedback() {
  const g = S.fb.gen, u = usageStats();

  o += `<div class="summary"><div class="stat"><b>${u.started}</b><span>${u.started === 1 ? 'zi' : 'zile'} cu exerciții</span></div><div class="stat"><b>${u.avg}%</b><span>exerciții bifate</span></div><div class="stat"><b>${u.journalDays}</b><span>${u.journalDays === 1 ? 'zi' : 'zile'} cu jurnal</span></div></div>`;

/* ---------- NOTIȚE DE REVIZUIRE (pentru Adela; se opresc cu CONFIG.reviewMode = false) ---------- */
function reviewKey(sec, id) {
  if (sec === 'ex') return id && exById(id) ? 'ex:' + id : 'ex';
  if (sec === 'teorie') return id && thById(id) ? 'th:' + id : 'teorie';
  if (sec === 'jurnal') return id === 'istoric' ? 'jurnal-istoric' : 'jurnal';

}
function reviewLabel(k) {
  if (k.startsWith('ex:')) { const e = exById(k.slice(3)); return 'Exercițiu: ' + (e ? e.title : k); }
  if (k.startsWith('th:')) { const t = thById(k.slice(3)); return 'Concept: ' + (t ? t.titlu : k); }
  return { azi: 'Ecranul Azi', ex: 'Lista de exerciții', teorie: 'Teorie (prezentare generală)', jurnal: 'Jurnal', 'jurnal-istoric': 'Istoric jurnal', feedback: 'Tabul Feedback', setari: 'Tabul Setări' }[k] || k;
}
function noteItem(n) {

function notesList(k) {

function reviewText() {
  const r = S.review || {}, keys = Object.keys(r).filter(k => r[k] && r[k].trim());
  let t = `Notițe de revizuire Papillon S1 (${CONFIG.version})\nData: ${todayISO()}\n`;
  if (S.profile.name) t += `De la: ${S.profile.name}\n`;
  if (!keys.length) return t + '\n(nicio notiță)\n';
  keys.forEach(k => { t += `\n== ${reviewLabel(k)} ==\n${r[k].trim()}\n`; });
  return t;
}
async function sendReview() {
  save(); const text = reviewText();
  if (CONFIG.feedbackUrl) { postRemote('review', text, 'Notițele au fost trimise. Mulțumim!'); return; }
  try { if (navigator.share) { await navigator.share({ title: 'Notițe de revizuire Papillon S1', text }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  copyText(text).then(() => toast('Notițele au fost copiate: lipește-le într-un mesaj'));
}
function downloadReview() {
  save(); const blob = new Blob([reviewText()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `notite-revizuire-papillon-s1-${todayISO()}.txt`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- rutare ---------- */
const NAV = [['azi', 'Azi', 'azi'], ['ex', 'Exerciții', 'ex'], ['teorie', 'Teorie', 'teorie'], ['jurnal', 'Jurnal', 'jurnal'], ['feedback', 'Feedback', 'feedback'], ['setari', 'Setări', 'setari']];

function backBar(sec, id) {
  const detail = (sec === 'ex' && id && exById(id)) || (sec === 'teorie' && id && thById(id)) || (sec === 'jurnal' && id === 'istoric');
  if (!detail) return '';
  const where = sec === 'ex' ? 'Exerciții' : sec === 'teorie' ? 'Teorie' : 'Jurnal';
  return `<div class="backbar"><button type="button" class="backbtn" data-back="#/${sec}" aria-label="Înapoi la ${where}">${svg('back')}<span>Înapoi</span></button><span class="backwhere">${where}</span></div>`;
}
function routeParts() { const [, sec = 'azi', id] = (location.hash || '#/azi').split('/'); return [sec, id]; }
function route() {
  const [sec, id] = routeParts();
  stopTimer();
  let html;
  if (sec === 'ex') html = id ? viewEx(id) : viewExList();
  else if (sec === 'teorie') html = id ? viewTh(id) : viewTeorie();
  else if (sec === 'jurnal') html = id === 'istoric' ? viewIstoric() : viewJurnal();
  else if (sec === 'setari') html = viewSetari();
  else if (sec === 'feedback') html = viewFeedback();
  else html = viewAzi();
  view().innerHTML = backBar(sec, id) + html + reviewBox(reviewKey(sec, id));
  $('#nav').innerHTML = NAV.map(([k, l, ic]) => `<a href="#/${k}" class="${k === 'teorie' ? 'hl' : ''}" ${(sec === k || (k === 'azi' && !NAV.some(n => n[0] === sec))) ? 'aria-current="page"' : ''}>${svg(ic)}<span>${l}</span></a>`).join('');
  document.title = 'Papillon · Săptămâna 1';
}
const navStack = [location.hash || '#/azi'];
window.addEventListener('hashchange', () => {
  const h = location.hash || '#/azi';
  if (navStack.length > 1 && navStack[navStack.length - 2] === h) navStack.pop();
  else if (navStack[navStack.length - 1] !== h) navStack.push(h);
});
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }

/* ---------- evenimente ---------- */
function applyTheme(t) {
  const root = document.documentElement;
  if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
}
function toggleCheck(id) {
  const c = (S.checks[selDay] = S.checks[selDay] || {}); c[id] = !c[id]; save(); rerender();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-day],[data-check-btn],[data-once-btn],[data-jtab],[data-rate],[data-exfb],[data-roata-add],[data-roata-del],[data-roata-save],[data-send],[data-dl],[data-toggle-theme],[data-reset],[data-media-save],[data-copy-media],[data-review-send],[data-review-dl],[data-back],[data-yn],[data-idea-add],[data-idea-del],[data-note-add],[data-note-del]');
  if (!t) return;
  if (t.dataset.day) { selDay = t.dataset.day; rerender(); }
  else if (t.dataset.checkBtn) toggleCheck(t.dataset.checkBtn);
  else if (t.dataset.onceBtn) { S.once[t.dataset.onceBtn] = !S.once[t.dataset.onceBtn]; save(); rerender(); }
  else if (t.dataset.jtab) { jTab = t.dataset.jtab; rerender(); }
  else if (t.dataset.rate) { S.fb.gen[t.dataset.rate] = +t.dataset.val; save(); rerender(); }
  else if (t.dataset.exfb) { const o = (S.fb.ex[t.dataset.exfb] = S.fb.ex[t.dataset.exfb] || {}); o.r = o.r === +t.dataset.val ? 0 : +t.dataset.val; save(); rerender(); }
  else if (t.hasAttribute('data-roata-add')) { S.roata.domains.push({ n: 'Domeniu nou', v: 5, note: '' }); save(); rerender(); }
  else if (t.hasAttribute('data-roata-del')) { S.roata.domains.pop(); save(); rerender(); }
  else if (t.hasAttribute('data-roata-save')) {
    S.roata.savedAt = todayISO(); S.roata.history.push({ d: S.roata.savedAt, v: S.roata.domains.map(d => ({ n: d.n, v: d.v })) });
    S.once.roata = true; save(); rerender(); toast('Roata a fost salvată');
  }
  else if (t.hasAttribute('data-back')) { if (navStack.length > 1) history.back(); else location.hash = t.dataset.back; }
  else if (t.dataset.yn) { const k = t.dataset.yn; S.fb.gen[k] = S.fb.gen[k] === t.dataset.val ? '' : t.dataset.val; if (k === 'timp' && S.fb.gen.timp !== 'nu') S.fb.gen.setare = ''; save(); rerender(); }
  else if (t.hasAttribute('data-idea-add')) {
    const v = (S.ideaDraft || '').trim(); if (!v) { toast('Scrie mai întâi ideea'); return; }
    const n = new Date(); (S.ideas = S.ideas || []).unshift({ id: Date.now().toString(36), d: todayISO(), t: `${pad(n.getHours())}:${pad(n.getMinutes())}`, x: v });
    S.ideaDraft = ''; save(); rerender(); toast('Ideea a fost salvată');
  }
  else if (t.dataset.ideaDel) { if (armed(t, 'Sigur?')) { S.ideas = (S.ideas || []).filter(x => x.id !== t.dataset.ideaDel); save(); rerender(); } }
  else if (t.hasAttribute('data-review-send')) sendReview();
  else if (t.hasAttribute('data-review-dl')) downloadReview();
  else if (t.hasAttribute('data-send')) sendFeedback();
  else if (t.hasAttribute('data-dl')) downloadFeedback();
  else if (t.hasAttribute('data-toggle-theme')) {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('papapp_theme', nx); } catch (e) { /* ignor */ } applyTheme(nx);
  }
  else if (t.hasAttribute('data-reset')) {
    if (armed(t, 'Apasă încă o dată ca să ștergi definitiv')) { (SYNC.wipe ? SYNC.wipe() : Promise.resolve()).catch(() => {}).then(() => { try { localStorage.removeItem(KEY); } catch (e) { /* ignor */ } location.hash = '#/azi'; location.reload(); }); }
  }
  else if (t.dataset.mediaSave) {
    const inp = $(`[data-media-in="${t.dataset.mediaSave}"]`); const v = inp.value.trim();
    if (SYNC.db && SYNC.edit) { SYNC.setMedia(t.dataset.mediaSave, v); toast(v ? 'Link salvat pentru toți' : 'Link șters pentru toți'); return; }
    if (v) S.media[t.dataset.mediaSave] = v; else delete S.media[t.dataset.mediaSave];
    save(); rerender(); toast('Link salvat local');
  }
  else if (t.dataset.noteAdd) SYNC.addNote(t.dataset.noteAdd);
  else if (t.dataset.noteDel) SYNC.delNote(t.dataset.noteDel);
  else if (t.hasAttribute('data-copy-media')) copyText(JSON.stringify(S.media, null, 2)).then(() => toast('Copiat'));
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.seg')) { ev.preventDefault(); selDay = ev.target.dataset.day; rerender(); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.matches('[data-check]')) toggleCheck(el.dataset.check);
  else if (el.matches('[data-th]')) { const [id, k] = el.dataset.th.split('|'); (S.theory[id] = S.theory[id] || {})[k] = el.checked; save(); rerender(); }
  else if (el.matches('[data-once]')) { S.once[el.dataset.once] = el.checked; save(); rerender(); }
  else if (el.matches('[data-day-pick]')) { selDay = el.value; rerender(); }
  else if (el.matches('[data-start]')) { if (el.value) { S.profile.start = el.value; initSelDay(); save(); toast('Data de start a fost schimbată'); } }
  else if (el.matches('select[data-bind]')) { setPath(el.dataset.bind, el.value); save(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.matches('input[data-bind],textarea[data-bind]')) { setPath(el.dataset.bind, el.value); saveSoon(); }
  else if (el.matches('[data-roata]')) {
    const i = +el.dataset.roata, v = +el.value; S.roata.domains[i].v = v;
    $('#dv' + i).textContent = v; $('#dn' + i).hidden = v >= 7;
    $('#radarBox').innerHTML = radarSVG(S.roata.domains); saveSoon();
  } else if (el.matches('[data-roata-name]')) {
    S.roata.domains[+el.dataset.roataName].n = el.value; $('#radarBox').innerHTML = radarSVG(S.roata.domains); saveSoon();
  }
});

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) { /* ignor */ } ta.remove(); return true;
  }
}
/* trimite textul către scriptul Apps Script (Sheet + email către Andrei și Adela) */
let sending = false;
function postRemote(type, text, okMsg) {
  if (sending) return Promise.resolve(); sending = true;
  const btns = $$('[data-send],[data-review-send]'); btns.forEach(b => { b.disabled = true; });
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  return new Promise(resolve => {
    let done = false, iframe, form, timer;
    const finish = (ok, why) => {
      if (done) return; done = true; clearTimeout(timer); window.removeEventListener('message', onMsg);
      if (iframe) iframe.remove(); if (form) form.remove();
      sending = false; btns.forEach(b => { b.disabled = false; });
      if (ok) toast(okMsg, 3500);
      else copyText(text).then(() => toast('Nu s-a putut trimite (' + why + '). Textul e copiat: îl poți lipi într-un mesaj.', 9000));
      resolve(ok);
    };
    const onMsg = ev => { const d = ev.data; if (d && d.papillon === id) finish(!!d.ok, d.error || 'respins de script'); };
    window.addEventListener('message', onMsg);
    iframe = document.createElement('iframe'); iframe.name = 'pap_fb_' + id; iframe.hidden = true; iframe.title = 'trimitere';
    form = document.createElement('form'); form.method = 'POST'; form.action = CONFIG.feedbackUrl; form.target = iframe.name; form.hidden = true;
    const inp = document.createElement('input'); inp.type = 'hidden'; inp.name = 'payload';
    inp.value = JSON.stringify({ id, type, version: CONFIG.version, name: S.profile.name || '', text });
    form.appendChild(inp); document.body.appendChild(iframe); document.body.appendChild(form);
    timer = setTimeout(() => finish(false, 'fără răspuns de la script'), 25000);
    form.submit();
  });
}
function sendFeedback() {
  save(); const text = feedbackText();
  if (SYNC.db) { SYNC.sendFeedback(text); return; }
  if (CONFIG.feedbackUrl) postRemote('feedback', text, 'Feedback trimis. Mulțumim!');
  else copyText(text).then(() => toast('Feedback copiat: lipește-l într-un mesaj'));
}
function downloadFeedback() {
  save(); const blob = new Blob([feedbackText()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `feedback-papillon-s1-${todayISO()}.txt`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- pornire ---------- */
function welcome() {
  const d = $('#welcome');
  d.innerHTML = `<div class="dlg"><img class="wlogo" src="${LOGO_SRC}" alt="" width="84" height="84"><h2 class="wt">Bun venit în Papillon</h2>
    <p>Aici găsești într-un singur loc exercițiile săptămânii 1, teoria din spatele lor, jurnalul „Gânduri pentru mine” și, pe măsură ce sosesc, înregistrările audio și videoclipurile Adelei.</p>
    <p class="small muted">Aceasta este o versiune de test. Notele tale rămân doar pe acest dispozitiv, iar la final îți cerem părerea în tabul Feedback.</p>
    <label class="f" for="wn">Cum te cheamă? (opțional)</label><input id="wn" type="text" autocomplete="given-name">
    <label class="f" for="ws">Ziua 1 a săptămânii</label><input id="ws" type="date" value="${S.profile.start}">
    <div class="btns" style="margin-top:16px"><button type="button" class="btn" id="wgo">Începem</button></div></div>`;
  d.hidden = false;
  $('#wgo').addEventListener('click', () => {
    S.profile.name = $('#wn').value.trim(); S.profile.start = $('#ws').value || todayISO(); S.profile.done = true;
    d.hidden = true; d.innerHTML = ''; initSelDay(); save(); route(); window.scrollTo(0, 0);
  });
}

(function boot() {
  let th = null; try { th = localStorage.getItem('papapp_theme'); } catch (e) { /* ignor */ }
  if (th === 'dark' || th === 'light') applyTheme(th);
  S.stats.sessions = (S.stats.sessions || 0) + 1; save();
  initSelDay();
  if (CONFIG.reviewMode) $('.testbadge').textContent = 'revizuire';
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('papapp_theme', nx); } catch (e) { /* ignor */ } applyTheme(nx);
  });
  window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
  route();
  if (!S.profile.done) welcome();
})();
/* ---------- sincronizare (doar în artefact): notițe comune, linkuri media comune, progres personal ---------- */
(async function initSync() {
  if (!window.claude || !window.claude.use) return;
  let db = null, user = null;
  try { db = await window.claude.use('db'); user = await window.claude.use('user'); } catch (e) { return; }
  if (!db) return;
  let uid = null;
  try { uid = user ? await user.id() : null; } catch (e) { /* fără id */ }
  try { SYNC.edit = user ? !!(await user.canEdit()) : false; } catch (e) { /* ignor */ }
  SYNC.db = db; SYNC.uid = uid; SYNC.on = true;
  const busy = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA)$/.test(a.tagName); };
  const playing = () => Array.from(document.querySelectorAll('audio,video')).some(m => !m.paused && !m.ended);
  const quiet = fn => { if (busy() || playing()) { setTimeout(() => quiet(fn), 1500); } else fn(); };

  /* linkuri media comune */
  const mref = db.doc('shared/media');
  mref.onSnapshot(snap => {
    const m = (snap.exists && snap.data().map) || {};
    if (JSON.stringify(m) === JSON.stringify(SYNC.media)) return;
    SYNC.media = m; quiet(rerender);
  }, () => { /* fără acces la linkuri comune */ });
  SYNC.setMedia = async (key, v) => {
    const m = Object.assign({}, SYNC.media); if (v) m[key] = v; else delete m[key];
    try { await mref.set({ map: m }); SYNC.media = m; rerender(); }
    catch (e) { toast('Nu am putut salva linkul. Încearcă din nou.', 4000); }
  };

  /* notițe comune */
  const nameFor = async ids => {
    if (!user || !user.profiles || !ids.length) return;
    try { const ps = await user.profiles(ids); ids.forEach(i => { SYNC.names[i] = (ps[i] && ps[i].name) || ''; }); } catch (e) { /* ignor */ }
  };
  db.collection('notes').orderBy('at', 'asc').onSnapshot(async snap => {
    SYNC.notes = snap.docs.map(d => Object.assign({ id: d.id, mine: !!uid && d.data().uid === uid }, d.data()));
    await nameFor([...new Set(SYNC.notes.filter(n => !n.mine).map(n => n.uid))]);
    const box = document.getElementById('noteslist');
    if (box) box.innerHTML = notesList(box.closest('.review') ? reviewKey(...routeParts()) : '');
  }, () => { /* fără acces la notițe */ });
  SYNC.addNote = async key => {
    const ta = document.getElementById('notein'); const text = ta ? ta.value.trim() : '';
    if (!text) { toast('Scrie întâi notița.'); return; }
    try {
      await db.collection('notes').add({ key, text, uid, at: Date.now(), version: CONFIG.version });
      if (ta) ta.value = ''; if (S.review) S.review[key] = ''; save(); toast('Notiță adăugată', 2500);
    } catch (e) { toast('Nu am putut adăuga notița. Încearcă din nou.', 4000); }
  };
  SYNC.delNote = async id => {
    const n = SYNC.notes.find(x => x.id === id); if (!n || !n.mine) return;
    try { await db.doc('notes/' + id).delete(); } catch (e) { toast('Nu am putut șterge notița.', 3000); }
  };

  /* feedback */
  SYNC.sendFeedback = async text => {
    try {
      await db.collection('feedback').add({ uid, at: Date.now(), version: CONFIG.version, name: S.profile.name || '', text });
      toast('Feedback trimis. Mulțumim!', 3500);
    } catch (e) { copyText(text).then(() => toast('Nu s-a putut trimite. Textul e copiat, îl poți lipi într-un mesaj.', 6000)); }
  };

  /* progres personal, sincronizat între dispozitivele aceleiași persoane */
  if (!uid) return;
  const sref = db.doc('data/users/' + uid + '/state');
  const strip = () => { const o = Object.assign({}, S); delete o.media; delete o._ts; return JSON.stringify(o); };
  let last = '', timer = null, firstSeen = false;
  const push = async () => {
    const str = strip(); if (str === last) return;
    const ts = Date.now();
    const prevLast = last, prevTs = S._ts; last = str; S._ts = ts;
    try { await sref.set({ ts, json: str }); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignor */ } }
    catch (e) { last = prevLast; S._ts = prevTs; /* se reîncearcă la următoarea salvare */ }
  };
  SYNC.push = () => { if (!firstSeen) return; clearTimeout(timer); timer = setTimeout(push, 2000); };
  SYNC.wipe = async () => { clearTimeout(timer); SYNC.push = null; await sref.delete(); };
  sref.onSnapshot(snap => {
    const first = !firstSeen; firstSeen = true;
    if (snap.exists) {
      const d = snap.data();
      if (d.json && (d.json === last || d.json === strip())) return;
      if (d.ts > (S._ts || 0)) {
        try {
          const r = JSON.parse(d.json);
          Object.keys(S).forEach(k => { if (k !== 'media') delete S[k]; });
          Object.assign(S, defaults(), r, { _ts: d.ts });
          last = d.json; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignor */ }
          if (S.profile.done) { const w = document.getElementById('welcome'); if (w) { w.hidden = true; w.innerHTML = ''; } }
          quiet(rerender); return;
        } catch (e) { /* stare coruptă: se ignoră */ }
      }
    }
    if (first && S.profile.done) push();
  }, () => { /* fără sincronizare personală */ });
})();
