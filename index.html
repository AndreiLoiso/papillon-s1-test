<style>
:root{--bg:#F2F5F9;--ink:#1F2E3D;--accent:#286899;--soft:#DDEAF5;--card:#fff;--line:#D3DEE9}
@media(prefers-color-scheme:dark){:root{--bg:#0B1824;--ink:#E7EEF5;--accent:#79B2E0;--soft:#1B3A57;--card:#12263A;--line:#25415C}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
main{width:100%;max-width:420px;text-align:center}
img{width:96px;height:96px;display:block;margin:0 auto 10px}
h1{margin:0 0 4px;font-size:1.7rem;letter-spacing:.18em;font-weight:600;color:var(--accent)}
p.sub{margin:0 0 26px;color:var(--ink);opacity:.8}
.choose{margin:0 0 12px;font-size:.95rem}
.btns{display:grid;gap:12px}
a.lang,button.lang{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:14px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-size:1.05rem;text-decoration:none;cursor:pointer}
body button.lang{background:var(--card);color:var(--accent)}
a.lang:hover,a.lang:focus-visible{filter:brightness(1.08)}
button.lang:hover,button.lang:focus-visible{background:var(--soft)}
.msg{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:.95rem;line-height:1.5;text-align:left}
.msg[hidden]{display:none}
.foot{margin-top:28px;font-size:.8rem;opacity:.65}
